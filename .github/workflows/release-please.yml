name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # Required for npm OIDC Trusted Publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        if: env.APP_ID != '' && env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Enable auto-merge on Release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER="${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).number || '' }}"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh pr list --search "head:release-please-- state:open" --json number --jq '.[0].number')
          fi
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "Checking auto-merge status for release PR #$PR_NUMBER"
            AUTO_MERGE=$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest')
            if [ "$AUTO_MERGE" = "null" ] || [ -z "$AUTO_MERGE" ]; then
              echo "Enabling auto-merge for release PR #$PR_NUMBER"
              gh pr merge "$PR_NUMBER" --auto --squash
            else
              echo "Auto-merge is already enabled for release PR #$PR_NUMBER"
            fi
          else
            echo "No open release PR found to auto-merge."
          fi
