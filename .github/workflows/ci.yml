name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/prompts/logs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/prompts/logs/**'

concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run test suite & prompt validators
        run: npm test

      - name: Build CLI package
        run: npm run build
