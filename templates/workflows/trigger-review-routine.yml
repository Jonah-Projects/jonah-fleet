name: Trigger Review Routine

on:
  pull_request:
    types: [ready_for_review, opened, reopened, synchronize, review_requested]
  schedule:
    # Periodic scan sweep every 2 hours to catch and recover any orphaned or unreviewed ready PRs
    - cron: '45 */2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional PR number to review in Targeted mode (leave blank for Scan mode)'
        required: false
        type: string
  issue_comment:
    types: [created]

jobs:
  trigger-routine:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--')) ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       !endsWith(github.event.comment.user.login, '[bot]') &&
       github.event.comment.user.type != 'Bot' &&
       (startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/peer-review') ||
        startsWith(github.event.comment.body, '/retrigger') ||
        startsWith(github.event.comment.body, '/re-review') ||
        contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/peer-review') ||
        contains(github.event.comment.body, '/retrigger') ||
        contains(github.event.comment.body, '/re-review')))
    concurrency:
      group: review-routine-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || 'scan' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Skip if PR already merged or closed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          if [ -z "$PR_NUM" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              open_prs=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=1" --jq 'length' 2>/dev/null || echo "0")
              if [ "$open_prs" -eq "0" ]; then
                echo "No open PRs found in ${{ github.repository }} — skipping scheduled review routine scan."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh_api_retry() {
            local endpoint="$1"
            shift
            local out="" err_file
            err_file="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              if out=$(gh api "$endpoint" "$@" 2>"$err_file"); then
                printf '%s' "$out"
                rm -f "$err_file"
                return 0
              fi
              sleep $((attempt * 2))
            done
            rm -f "$err_file"
            return 1
          }

          if ! pr=$(gh_api_retry "repos/${{ github.repository }}/pulls/${PR_NUM}"); then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          state=$(echo "$pr" | jq -r '.state')
          merged=$(echo "$pr" | jq -r '.merged')
          head_ref=$(echo "$pr" | jq -r '.head.ref')
          if [ "$state" = "closed" ] || [ "$merged" = "true" ]; then
            echo "PR is already $state/merged=$merged — skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$head_ref" == release-please--* ]]; then
            echo "PR head branch $head_ref is an automated release PR — skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Priority-driven dual execution filter on direct pull_request triggers:
          # Strict allowlist: only trigger immediate cloud review if explicitly labeled priority/P0 or priority/P1.
          # Untagged PRs and lower-priority PRs (P2/P3) skip immediate cloud review and are handled by local peer-review daemons
          # (cloud scheduled watchdog sweep will catch up if unreviewed > 48h).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            labels=$(echo "$pr" | jq -r '.labels[].name' 2>/dev/null || echo "")
            if ! echo "$labels" | grep -qE '^priority/P[01]$'; then
              echo "PR is not explicitly labeled priority/P0 or priority/P1 — skipping immediate cloud review for local peer-review daemon."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git author identity
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Antigravity CLI
        if: steps.guard.outputs.skip != 'true'
        id: cache-agy
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/agy
          key: agy-cli-linux-amd64-v1

      - name: Install Antigravity CLI
        if: steps.guard.outputs.skip != 'true' && steps.cache-agy.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash

      - name: Add Antigravity CLI to PATH
        if: steps.guard.outputs.skip != 'true'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write Antigravity OAuth Token
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTIGRAVITY_OAUTH_TOKEN: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN || secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$ANTIGRAVITY_OAUTH_TOKEN" ]; then
            echo "::error::Neither ANTIGRAVITY_OAUTH_TOKEN nor GEMINI_API_KEY secret is set; cannot authenticate Antigravity CLI." >&2
            exit 1
          fi
          mkdir -p "$HOME/.gemini/antigravity-cli"
          chmod 700 "$HOME/.gemini/antigravity-cli"
          printf '%s' "$ANTIGRAVITY_OAUTH_TOKEN" > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          chmod 600 "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"

      - name: Resolve routine configuration
        if: steps.guard.outputs.skip != 'true'
        id: routine-config
        run: |
          ROUTINE="peer-review"
          DEFAULT_MODEL="gemini-3.7-flash-high"
          DEFAULT_TIMEOUT="55"

          MODEL="$DEFAULT_MODEL"
          TIMEOUT="$DEFAULT_TIMEOUT"

          if [ -f "agents-manifest.json" ]; then
            CONFIG_JSON=$(node -e '
              try {
                const fs = require("fs");
                const m = JSON.parse(fs.readFileSync("agents-manifest.json", "utf8"));
                const r = process.argv[1];
                const model = m.models?.[r] || m.models?.default;
                const timeout = m.budgets?.timeoutMinutes?.[r] || m.budgets?.timeoutMinutes?.default;
                console.log(JSON.stringify({ model: model || "", timeout: timeout ? String(timeout) : "" }));
              } catch (e) {
                console.log(JSON.stringify({ model: "", timeout: "" }));
              }
            ' "$ROUTINE")

            RESOLVED_MODEL=$(node -e "try { console.log(JSON.parse(process.argv[1]).model || ''); } catch {}" "$CONFIG_JSON")
            RESOLVED_TIMEOUT=$(node -e "try { console.log(JSON.parse(process.argv[1]).timeout || ''); } catch {}" "$CONFIG_JSON")

            if [ -n "$RESOLVED_MODEL" ]; then
              MODEL="$RESOLVED_MODEL"
            fi
            if [ -n "$RESOLVED_TIMEOUT" ]; then
              TIMEOUT="$RESOLVED_TIMEOUT"
            fi
          fi

          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "print_timeout=${TIMEOUT}m" >> "$GITHUB_OUTPUT"
          echo "Resolved routine configuration: model=$MODEL, timeout=${TIMEOUT}m"

      - name: Initialize Routine Run Issue
        if: steps.guard.outputs.skip != 'true'
        id: run-issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          PR_ARG="${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}"
          if [ -n "$PR_ARG" ]; then
            TITLE="[peer-review] run ${TIMESTAMP} (PR #${PR_ARG})"
          else
            TITLE="[peer-review] run ${TIMESTAMP}"
          fi
          BODY="### Autonomous Routine Execution in Progress
          - **Routine**: \`peer-review\`
          - **Timestamp**: \`${TIMESTAMP}\`
          - **Trigger**: \`${{ github.event_name }}\`
          - **Run ID**: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          ISSUE_URL=$(gh issue create --title "$TITLE" --body "$BODY" --label "routine-log,routine:peer-review,status:running,runner:github-actions")
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ROUTINE_ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"

      - name: Run Peer Review
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 55
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTIGRAVITY_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          ROUTINE_ISSUE_NUMBER: ${{ steps.run-issue.outputs.issue_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            if [ -z "$PR_URL" ] || [[ "$PR_URL" == *"/issues/"* ]]; then
              PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
            fi
            PROMPT="You are the Peer Review routine for this repository. Read and follow the instructions in .github/prompts/peer-review.md exactly. Your target is pull request #${PR_NUMBER} (${PR_URL}). You are in Targeted mode: review PR #${PR_NUMBER} directly."
          else
            PROMPT="You are the Peer Review routine for this repository. Read and follow the instructions in .github/prompts/peer-review.md exactly. You are in Scan mode: check open PRs and select the highest-priority PR to review."
          fi

          agy -p "$PROMPT" \
            --model "${{ steps.routine-config.outputs.model || 'gemini-3.7-flash-high' }}" \
            --output-format text \
            --print-timeout "${{ steps.routine-config.outputs.print_timeout || '55m' }}" \
            --dangerously-skip-permissions

      - name: Handle Review Failure & PR Notification
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "⚠️ **Peer Review Routine Notice**: The automated review session encountered an execution error (e.g., API rate/quota limit or runner interruption). The review will be retried automatically on the next scheduled scan sweep or can be re-triggered immediately by commenting \`/review\` on this PR.

          _Generated by [Antigravity](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_" || true
          fi

      - name: Emit run summary
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          REPORT_FILE=".jonah-fleet/run-report.md"
          if [ -f "$REPORT_FILE" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Emit Fleet Telemetry (Opt-in)
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          TELEMETRY_ENDPOINT: ${{ secrets.JONAH_FLEET_TELEMETRY_ENDPOINT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          REPORT_FILE=".jonah-fleet/run-report.md"
          if [ -f "$REPORT_FILE" ]; then
            npx --yes jonah-fleet telemetry --emit --log "$REPORT_FILE" --endpoint "$TELEMETRY_ENDPOINT" || true
          fi

      - name: Reconcile Routine Run Issue
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          ISSUE_NUMBER: ${{ steps.run-issue.outputs.issue_number }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No routine issue to reconcile."
            exit 0
          fi

          REPORT_FILE=".jonah-fleet/run-report.md"
          JOB_STATUS="${{ job.status }}"

          if [ -f "$REPORT_FILE" ]; then
            BODY_CONTENT=$(cat "$REPORT_FILE")
          else
            BODY_CONTENT="### Autonomous Routine Execution Completed (${JOB_STATUS})
          - **Routine**: \`peer-review\`
          - **Run ID**: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Trigger**: \`${{ github.event_name }}\`"
          fi

          FINAL_BODY="${BODY_CONTENT}

          ---
          _Generated by [Antigravity](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"

          TEMP_BODY=$(mktemp)
          echo "$FINAL_BODY" > "$TEMP_BODY"
          gh issue edit "$ISSUE_NUMBER" --body-file "$TEMP_BODY"
          rm -f "$TEMP_BODY"

          if [ "$JOB_STATUS" = "success" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "status:success" --remove-label "status:running"
            gh issue close "$ISSUE_NUMBER" --reason completed
            echo "✓ Routine run issue #$ISSUE_NUMBER closed as completed."
          else
            gh issue edit "$ISSUE_NUMBER" --add-label "status:failure,needs-attention" --remove-label "status:running"
            echo "⚠️ Routine run issue #$ISSUE_NUMBER left open for triage (status: $JOB_STATUS)."
          fi
