name: Analytics Review Scheduled Cron (agy)

# Scheduled execution of the Analytics Review routine using Antigravity CLI on Gemini 3.8 Flash.
# Queries Vercel, PostHog, and GitHub CI volume, executes §1–§7 checks, updates measurement trackers,
# stages product action directives into Product Planning, and logs to a two-phase routine run issue.

on:
  schedule:
    # Daily at 07:00 UTC (09:00 Paris CEST)
    - cron: '0 7 * * *'
  workflow_dispatch:

# Single-flight: do not run overlapping analytics review runs.
concurrency:
  group: analytics-review-agent
  cancel-in-progress: false

jobs:
  run-analytics-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git author identity
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          if USER_JSON=$(gh api user 2>/dev/null); then
            ACTOR_NAME=$(echo "$USER_JSON" | jq -r '.login // empty')
            ACTOR_ID=$(echo "$USER_JSON" | jq -r '.id // empty')
          fi
          ACTOR_NAME="${ACTOR_NAME:-${{ vars.AGENT_BOT_LOGIN || '' }}}"
          if [ -n "$ACTOR_NAME" ] && [ -n "$ACTOR_ID" ]; then
            git config --global user.name "$ACTOR_NAME"
            git config --global user.email "${ACTOR_ID}+${ACTOR_NAME}@users.noreply.github.com"
          elif [ -n "$ACTOR_NAME" ]; then
            git config --global user.name "$ACTOR_NAME"
            git config --global user.email "${ACTOR_NAME}@users.noreply.github.com"
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh auth setup-git

      - name: Cache Antigravity CLI
        id: cache-agy
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/agy
          key: agy-cli-linux-amd64-v1

      - name: Install Antigravity CLI
        if: steps.cache-agy.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash

      - name: Add Antigravity CLI to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write Antigravity OAuth Token
        env:
          ANTIGRAVITY_OAUTH_TOKEN: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN || secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$ANTIGRAVITY_OAUTH_TOKEN" ]; then
            echo "::error::Neither ANTIGRAVITY_OAUTH_TOKEN nor GEMINI_API_KEY secret is set; cannot authenticate Antigravity CLI." >&2
            exit 1
          fi
          mkdir -p "$HOME/.gemini/antigravity-cli"
          chmod 700 "$HOME/.gemini/antigravity-cli"
          printf '%s' "$ANTIGRAVITY_OAUTH_TOKEN" > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          chmod 600 "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"

      - name: Fast preflight credential validation (SwarmClaw Pattern #2)
        run: |
          if [ ! -s "$HOME/.gemini/antigravity-cli/antigravity-oauth-token" ]; then
            echo "::error::Preflight credential check failed: Antigravity OAuth token file is missing or empty." >&2
            exit 1
          fi
          echo "✓ Preflight credential validation passed."

      - name: Configure MCP servers for Antigravity CLI
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$POSTHOG_API_KEY" ]; then
            echo "Configuring PostHog MCP server..."
            agy mcp add --header "Authorization: Bearer $POSTHOG_API_KEY" posthog https://mcp.posthog.com/mcp || true
          fi
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Configuring Vercel MCP server..."
            agy mcp add --header "Authorization: Bearer $VERCEL_TOKEN" vercel https://mcp.vercel.com || true
          fi
          agy mcp list || true

      - name: Discover and compile domain skills (SwarmClaw Pattern #4)
        id: skills
        run: |
          SKILLS_LIST=""
          if [ -f ".agents/skills/validate-data/SKILL.md" ]; then
            SKILLS_LIST="Read and follow .agents/skills/validate-data/SKILL.md."
          fi
          echo "skills_prompt=$SKILLS_LIST" >> "$GITHUB_OUTPUT"

      - name: Resolve routine configuration
        id: routine-config
        run: |
          ROUTINE="analytics-review"
          DEFAULT_MODEL="gemini-3.8-flash-high"
          DEFAULT_TIMEOUT="50"

          MODEL="$DEFAULT_MODEL"
          TIMEOUT="$DEFAULT_TIMEOUT"

          if [ -f "agents-manifest.json" ]; then
            CONFIG_JSON=$(node -e '
              try {
                const fs = require("fs");
                const m = JSON.parse(fs.readFileSync("agents-manifest.json", "utf8"));
                const r = process.argv[1];
                const model = m.models?.[r] || m.models?.default;
                const timeout = m.budgets?.timeoutMinutes?.[r] || m.budgets?.timeoutMinutes?.default;
                console.log(JSON.stringify({ model: model || "", timeout: timeout ? String(timeout) : "" }));
              } catch (e) {
                console.log(JSON.stringify({ model: "", timeout: "" }));
              }
            ' "$ROUTINE")

            RESOLVED_MODEL=$(node -e "try { console.log(JSON.parse(process.argv[1]).model || ''); } catch {}" "$CONFIG_JSON")
            RESOLVED_TIMEOUT=$(node -e "try { console.log(JSON.parse(process.argv[1]).timeout || ''); } catch {}" "$CONFIG_JSON")

            if [ -n "$RESOLVED_MODEL" ]; then
              MODEL="$RESOLVED_MODEL"
            fi
            if [ -n "$RESOLVED_TIMEOUT" ]; then
              TIMEOUT="$RESOLVED_TIMEOUT"
            fi
          fi

          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "print_timeout=${TIMEOUT}m" >> "$GITHUB_OUTPUT"
          echo "Resolved routine configuration: model=$MODEL, timeout=${TIMEOUT}m"

      - name: Initialize Routine Run Issue
        id: run-issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          TITLE="[analytics-review] run ${TIMESTAMP}"
          BODY="### Autonomous Routine Execution in Progress
          - **Routine**: \`analytics-review\`
          - **Timestamp**: \`${TIMESTAMP}\`
          - **Trigger**: \`${EVENT_NAME}\`
          - **Run ID**: [\`${RUN_ID}\`](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})

          ---
          _Generated by [Antigravity](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})_"
          ISSUE_URL=$(gh issue create --title "$TITLE" --body "$BODY" --label "routine-log,routine:analytics-review,status:running,runner:github-actions")
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ROUTINE_ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"

      - name: Run Analytics Review
        timeout-minutes: 50
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTIGRAVITY_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          ROUTINE: analytics-review
          ROUTINE_ISSUE_NUMBER: ${{ steps.run-issue.outputs.issue_number }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          MODEL: ${{ steps.routine-config.outputs.model || 'gemini-3.8-flash-high' }}
          PRINT_TIMEOUT: ${{ steps.routine-config.outputs.print_timeout || '50m' }}
          SKILLS_PROMPT: ${{ steps.skills.outputs.skills_prompt }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          PROMPT="You are the Analytics Review routine for this repository. Read and follow the instructions in .github/prompts/analytics-review.md exactly. ${SKILLS_PROMPT}"

          set +e
          node .github/scripts/run-with-loop-guard.js \
            -p "$PROMPT" \
            --model "$MODEL" \
            --output-format text \
            --print-timeout "$PRINT_TIMEOUT" \
            --dangerously-skip-permissions 2>&1 | tee /tmp/agy.log
          AGY_EXIT_CODE="${PIPESTATUS[0]}"
          set -e

          if [ "$AGY_EXIT_CODE" -ne 0 ]; then
            if grep -qiE "Individual quota reached|quota reached" /tmp/agy.log; then
              RESET_INFO=$(grep -oE "Resets in [^.]+" /tmp/agy.log | head -n 1 || echo "Resets in future window")
              echo "QUOTA_PAUSED=true" >> "$GITHUB_ENV"
              echo "QUOTA_RESET_INFO=$RESET_INFO" >> "$GITHUB_ENV"
              echo "⚠️ LLM quota limit reached ($RESET_INFO). Pausing routine gracefully until next sweep."
              exit 0
            fi
            exit "$AGY_EXIT_CODE"
          fi

      - name: Emit run summary
        if: always()
        run: |
          if [ "$QUOTA_PAUSED" = "true" ]; then
            echo "### ⏸️ Milestone: Routine Execution Quota-Paused" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status**: LLM quota reached (\`${QUOTA_RESET_INFO}\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Next Action**: Routine execution paused cleanly. Work will resume automatically on the next scheduled sweep after the quota window resets." >> "$GITHUB_STEP_SUMMARY"
          else
            REPORT_FILE=".jonah-fleet/run-report.md"
            if [ -f "$REPORT_FILE" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
              cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Emit Fleet Telemetry (Opt-in)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          TELEMETRY_ENDPOINT: ${{ secrets.JONAH_FLEET_TELEMETRY_ENDPOINT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          REPORT_FILE=".jonah-fleet/run-report.md"
          if [ -f "$REPORT_FILE" ]; then
            npx --yes jonah-fleet telemetry --emit --log "$REPORT_FILE" --endpoint "$TELEMETRY_ENDPOINT" || true
          fi

      - name: Reconcile Routine Run Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          ISSUE_NUMBER: ${{ steps.run-issue.outputs.issue_number }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          QUOTA_PAUSED: ${{ env.QUOTA_PAUSED }}
          QUOTA_RESET_INFO: ${{ env.QUOTA_RESET_INFO }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No routine issue to reconcile."
            exit 0
          fi

          if [ "$QUOTA_PAUSED" = "true" ]; then
            RESET_STR="${QUOTA_RESET_INFO:-Resets in upcoming window}"
            PAUSE_BODY="### ⏸️ Autonomous Routine Execution Quota-Paused
          - **Routine**: \`analytics-review\`
          - **Run ID**: [\`${RUN_ID}\`](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})
          - **Trigger**: \`${EVENT_NAME}\`
          - **Status**: LLM quota reached (\`${RESET_STR}\`)
          - **Next Action**: Routine execution paused cleanly. Work will resume automatically on the next scheduled sweep after the quota window resets.

          ---
          _Generated by [Antigravity](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})_"

            TEMP_BODY=$(mktemp)
            echo "$PAUSE_BODY" > "$TEMP_BODY"
            gh issue edit "$ISSUE_NUMBER" --body-file "$TEMP_BODY"
            rm -f "$TEMP_BODY"

            PAUSE_COMMENT=$(printf '%s\n' \
              "### ⏸️ Milestone: Routine Execution Quota-Paused" \
              "- **Routine**: \`analytics-review\`" \
              "- **Status**: LLM quota reached (\`${RESET_STR}\`)" \
              "- **Action Log**: [View GitHub Actions Run](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})" \
              "- **Next Action**: Execution paused cleanly. The routine will resume automatically on the next scheduled sweep." \
              "" \
              "---" \
              "_Generated by [Antigravity](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})_")
            gh issue comment "$ISSUE_NUMBER" --body "$PAUSE_COMMENT" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "status:quota-paused" --remove-label "status:running"
            gh issue close "$ISSUE_NUMBER" --reason completed
            echo "⏸️ Routine run issue #$ISSUE_NUMBER closed with status:quota-paused."
            exit 0
          fi

          REPORT_FILE=".jonah-fleet/run-report.md"

          if [ -f "$REPORT_FILE" ]; then
            BODY_CONTENT=$(cat "$REPORT_FILE")
          else
            BODY_CONTENT="### Autonomous Routine Execution Completed (${JOB_STATUS})
          - **Routine**: \`analytics-review\`
          - **Run ID**: [\`${RUN_ID}\`](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})
          - **Trigger**: \`${EVENT_NAME}\`"
          fi

          FINAL_BODY="${BODY_CONTENT}

          ---
          _Generated by [Antigravity](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})_"

          TEMP_BODY=$(mktemp)
          echo "$FINAL_BODY" > "$TEMP_BODY"
          gh issue edit "$ISSUE_NUMBER" --body-file "$TEMP_BODY"
          rm -f "$TEMP_BODY"

          if [ "$JOB_STATUS" = "success" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "status:success" --remove-label "status:running"
            gh issue close "$ISSUE_NUMBER" --reason completed
            echo "✓ Routine run issue #$ISSUE_NUMBER closed as completed."
          else
            INTERRUPTION_BODY=$(printf '%s\n' \
              "### ❌ Milestone: Run Interrupted / Failed" \
              "- **Routine**: \`analytics-review\`" \
              "- **Status**: Workflow job failed or timed out (\`${JOB_STATUS}\`)" \
              "- **Step**: Actions execution halted before normal completion" \
              "- **Action Log**: [View GitHub Actions Run](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})" \
              "" \
              "---" \
              "_Generated by [Antigravity](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID})_")
            gh issue comment "$ISSUE_NUMBER" --body "$INTERRUPTION_BODY" || true
            gh issue edit "$ISSUE_NUMBER" --add-label "status:failure,needs-attention" --remove-label "status:running"
            echo "⚠️ Routine run issue #$ISSUE_NUMBER left open for triage (status: $JOB_STATUS)."
          fi
